name: Weekly Newsletter

on:
  schedule:
    # 1:05 AM Central every Tuesday, after Monday Night Football has finished.
    # This intentionally runs Tuesday rather than immediately after the Monday game.
    - cron: "5 1 * * 2"
      timezone: "America/Chicago"
  workflow_dispatch:
    inputs:
      newsletter_week:
        description: "Generate one specific completed week (leave blank for latest)"
        required: false
        type: string
      backfill_weeks:
        description: "Generate this many most-recent completed weeks (leave blank for normal weekly run)"
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: weekly-newsletter
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  NEWSLETTER_ENABLED: ${{ vars.NEWSLETTER_ENABLED || 'false' }}
  NEWSLETTER_PROVIDER: ${{ vars.NEWSLETTER_PROVIDER || 'gemini' }}
  NEWSLETTER_MODEL: ${{ vars.NEWSLETTER_MODEL || 'gemini-3.5-flash-lite' }}
  YAHOO_GAME_ID: ${{ vars.YAHOO_GAME_ID || 'nfl' }}
  YAHOO_SEASON: ${{ vars.YAHOO_SEASON || '2026' }}
  YAHOO_LEAGUE_ID: ${{ vars.YAHOO_LEAGUE_ID }}
  YAHOO_API_ENABLED: ${{ vars.YAHOO_API_ENABLED || 'false' }}

jobs:
  generate:
    if: vars.NEWSLETTER_ENABLED == 'true' || inputs.newsletter_week != '' || inputs.backfill_weeks != ''
    runs-on: ubuntu-latest
    environment:
      name: general

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Fetch Yahoo data
        if: env.YAHOO_API_ENABLED == 'true'
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: npm run fetch:yahoo

      - name: Validate Yahoo data is enabled
        if: env.YAHOO_API_ENABLED != 'true' && inputs.newsletter_week == '' && inputs.backfill_weeks == ''
        run: |
          if [ "${YAHOO_API_ENABLED}" != "true" ]; then
            echo "NEWSLETTER_ENABLED is true, but YAHOO_API_ENABLED is not true."
            echo "Enable the Yahoo data pipeline before enabling weekly newsletters."
            exit 1
          fi

      - name: Generate normalized data
        if: env.YAHOO_API_ENABLED == 'true' || (inputs.newsletter_week == '' && inputs.backfill_weeks == '')
        run: npm run generate

      - name: Generate newsletter
        env:
          NEWSLETTER_ENABLED: ${{ (vars.NEWSLETTER_ENABLED == 'true' || inputs.newsletter_week != '' || inputs.backfill_weeks != '') && 'true' || 'false' }}
          NEWSLETTER_PROVIDER: ${{ env.NEWSLETTER_PROVIDER }}
          NEWSLETTER_MODEL: ${{ env.NEWSLETTER_MODEL }}
          NEWSLETTER_WEEK: ${{ inputs.newsletter_week }}
          NEWSLETTER_BACKFILL_WEEKS: ${{ inputs.backfill_weeks }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$NEWSLETTER_BACKFILL_WEEKS" ]; then
            latest=$(node -e 'const l=require("./data/current/league.json"); console.log(Math.max(...(l.completedWeeks || [])))')
            start=$((latest - NEWSLETTER_BACKFILL_WEEKS + 1))
            first_week=true
            for week in $(seq "$start" "$latest"); do
              if [ "$first_week" != "true" ]; then
                echo "Waiting 90 seconds for Gemini free-tier rate limits to reset..."
                sleep 90
              fi
              first_week=false
              echo "Generating newsletter for Week $week"
              NEWSLETTER_WEEK="$week" NEWSLETTER_FORCE=true npm run newsletter:generate
            done
          else
            npm run newsletter:generate
          fi
      - name: Commit newsletter
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- newsletter/data newsletter/output)" ]; then
            echo "No newsletter files changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add newsletter/data newsletter/output
          git commit -m "feat: publish weekly league newsletter"
          git push origin main

          echo "Triggering GitHub Pages deployment..."
          gh workflow run deploy.yml --ref main
