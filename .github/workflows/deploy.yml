name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  VITE_ENABLE_MANAGER_PROFILES: ${{ vars.MANAGER_PROFILES_ENABLED || 'true' }}
  YAHOO_GAME_ID: ${{ vars.YAHOO_GAME_ID || 'nfl' }}
  YAHOO_SEASON: ${{ vars.YAHOO_SEASON || '2026' }}
  YAHOO_LEAGUE_ID: ${{ vars.YAHOO_LEAGUE_ID }}
  # Keep Yahoo disabled until API provisioning is complete. Set the repository variable to "true" to enable live data.
  YAHOO_API_ENABLED: ${{ vars.YAHOO_API_ENABLED || 'false' }}

jobs:
  build:
    environment:
      name: general
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Fetch Yahoo data
        if: env.YAHOO_API_ENABLED == 'true'
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: npm run fetch:yahoo

      - name: Generate production data
        if: env.YAHOO_API_ENABLED == 'true'
        run: npm run generate

      - name: Copy generated data into the static site
        if: env.YAHOO_API_ENABLED == 'true'
        run: |
          rm -rf public/data/current
          mkdir -p public/data
          cp -R data/current public/data/current

      - name: Build
        env:
          VITE_USE_MOCK_DATA: ${{ env.YAHOO_API_ENABLED == 'true' && 'false' || 'true' }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
